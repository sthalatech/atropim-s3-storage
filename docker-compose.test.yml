version: "3.8"

# Local/CI fixture used only for integration tests (tests/Integration).
# Not part of the addon's runtime — AtroPIM installs point at a real bucket instead.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: s3storage-test
      MINIO_ROOT_PASSWORD: s3storage-test-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 s3storage-test s3storage-test-secret &&
      mc mb --ignore-existing local/s3storage-test-bucket
      "
